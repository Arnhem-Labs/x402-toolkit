[package]
name        = "x402-toolkit-client"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
homepage    = { workspace = true }
authors     = { workspace = true }
description = "Async HTTP client, wallet signer trait, and pluggable facilitator for x402 payments."
keywords    = ["x402", "payments", "eip-3009", "facilitator", "signer"]
categories  = ["api-bindings", "asynchronous", "web-programming::http-client"]
readme      = "README.md"

[features]
default      = ["rustls"]
rustls       = ["reqwest/rustls-tls"]
native-tls   = ["reqwest/native-tls"]
# Enables network-touching examples and ignored integration tests against Base Sepolia.
sepolia-example = []

[dependencies]
x402-toolkit-types  = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
chrono              = { workspace = true }
tracing             = { workspace = true }
async-trait         = { workspace = true }
reqwest             = { workspace = true }
tokio               = { workspace = true }
hex                 = { workspace = true }
rand                = "0.8"
alloy-primitives    = { workspace = true }
alloy-sol-types     = { workspace = true }
alloy-signer        = { workspace = true }
alloy-signer-local  = { workspace = true }

[dev-dependencies]
tokio       = { workspace = true, features = ["test-util"] }
tokio-test  = { workspace = true }
